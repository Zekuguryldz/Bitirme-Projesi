<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Fiyat ve Shrinkflation İzleme Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=26">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="site-shell">
        <nav class="navbar navbar-expand-lg sticky-top app-navbar">
            <div class="container">
                <a class="navbar-brand fw-bold" href="/">Fiyat İzleme Paneli</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Navigasyonu aç">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item telegram-market-nav-item">
                            <a
                                class="telegram-market-link"
                                href="https://t.me/bitirmeshrinkflationsok"
                                id="telegramMarketLink"
                                target="_blank"
                                rel="noopener noreferrer"
                                aria-label="Seçili marketin Telegram grubunu aç"
                                title="Seçili marketin Telegram grubunu aç"
                            >
                                <span class="telegram-market-icon" aria-hidden="true">
                                    <svg viewBox="0 0 48 48" fill="none">
                                        <circle cx="24" cy="24" r="24" fill="#2AABEE"/>
                                        <path d="M34.88 14.98L12.9 23.45c-1.5.6-1.49 1.43-.27 1.81l5.64 1.76 13.05-8.23c.62-.37 1.18-.17.71.24l-10.57 9.54-.39 5.84c.57 0 .82-.26 1.14-.56l2.74-2.66 5.71 4.22c1.05.58 1.8.28 2.06-.98l3.75-17.68c.38-1.54-.59-2.23-1.59-1.78Z" fill="#fff"/>
                                    </svg>
                                </span>
                            </a>
                        </li>
                        <li class="nav-item dropdown">
                            <a
                                class="nav-link dropdown-toggle {% if request.url.path in ['/', '/urunler', '/urun-karsilastirmalari', '/riskli-urunler'] %}active{% endif %}"
                                href="#"
                                id="mainMenuDropdown"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                            >
                                <span class="menu-trigger-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none">
                                        <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                </span>
                                Menü
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end app-dropdown-menu" aria-labelledby="mainMenuDropdown">
                                <li><a class="dropdown-item {% if request.url.path == '/' %}active{% endif %}" href="/">Ana Sayfa</a></li>
                                <li class="dropdown-submenu">
                                    <button
                                        class="dropdown-item submenu-toggle {% if request.url.path in ['/urunler', '/urun-karsilastirmalari'] %}active{% endif %}"
                                        type="button"
                                    >
                                        Ürünler
                                    </button>
                                    <ul class="dropdown-menu submenu-menu">
                                        <li><a class="dropdown-item {% if request.url.path == '/urunler' %}active{% endif %}" href="/urunler">Ürün Listesi</a></li>
                                        <li><a class="dropdown-item {% if request.url.path == '/urun-karsilastirmalari' %}active{% endif %}" href="/urun-karsilastirmalari">Ürün Karşılaştırmaları</a></li>
                                    </ul>
                                </li>
                                <li><a class="dropdown-item {% if request.url.path == '/riskli-urunler' %}active{% endif %}" href="/riskli-urunler">Riskli Ürünler</a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="py-4 py-lg-5">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', path='js/market_telegram_link.js') }}?v=1"></script>
</body>
</html>
